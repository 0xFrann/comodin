<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<title>Generar og.png</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800;900&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
  body { margin: 0; padding: 24px 16px; font: 16px/1.5 "Barlow", system-ui, sans-serif; background: #0B1222; color: #E8D8BC; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  canvas { width: min(100%, 900px); height: auto; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  button { font: 600 16px "Barlow", system-ui, sans-serif; padding: 12px 18px; border: 0; background: #C98255; color: #18243B; cursor: pointer; }
  p { margin: 0; max-width: 60ch; text-align: center; color: #A7B1C4; }
</style>
</head>
<body>
<p>Esta es la imagen que muestra WhatsApp cuando mandás el link. Descargala y subila a la raíz del repo como <b>og.png</b>.</p>
<canvas id="cv" width="1200" height="630"></canvas>
<button id="dl" type="button">Descargar og.png</button>
<script src="../assets/config.js?v=20261021215021"></script>
<script src="../assets/comodin.js?v=20261021215021"></script>
<script>
(async function () {
  const C = window.COMODIN_CONFIG, cv = document.getElementById("cv"), x = cv.getContext("2d");
  await Comodin.fontsReady();
  x.fillStyle = "#0B1222"; x.fillRect(0, 0, 1200, 630);
  // boleto inclinado
  const W = 340, H = W * 1.4, tk = Comodin.ticketCanvas({ n: 0, nombre: "", fecha: "" }, W);
  x.save(); x.translate(110 + W / 2, 315); x.rotate(-6 * Math.PI / 180);
  x.shadowColor = "rgba(3,6,16,.65)"; x.shadowBlur = 36; x.shadowOffsetY = 18;
  x.drawImage(tk, -W / 2, -H / 2); x.restore();
  // texto
  const ls = (v) => { if ("letterSpacing" in x) x.letterSpacing = v; };
  x.textBaseline = "alphabetic"; x.textAlign = "left";
  x.fillStyle = "#A7B1C4"; x.font = '600 20px "IBM Plex Mono"'; ls("4px"); x.fillText("TRANSFERIBLE · NO VENCE", 560, 168); ls("0px");
  x.fillStyle = "#E8D8BC"; x.font = '900 76px "Big Shoulders Display"'; x.fillText("TENÉS UN", 556, 252);
  x.fillStyle = "#C98255"; x.font = '900 196px "Big Shoulders Display"'; ls("12px"); x.fillText("VALE", 550, 420); ls("0px");
  x.fillStyle = "#E8D8BC"; x.font = 'italic 600 34px "Barlow"'; x.fillText("Por un día, para lo que necesites.", 560, 478);
  x.fillStyle = "#A7B1C4"; x.font = '600 21px "IBM Plex Mono"'; x.fillText("Abrilo y dalo vuelta ↻", 560, 524);
  document.getElementById("dl").addEventListener("click", () => {
    cv.toBlob((b) => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "og.png"; a.click(); });
  });
})();
</script>
</body>
</html>
