<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Generar og.png</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,500&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  body { margin: 0; padding: 24px 16px; font: 15px/1.5 system-ui, sans-serif; background: #E7E9F2; color: #141833; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  canvas { width: min(100%, 900px); height: auto; border-radius: 8px; box-shadow: 0 10px 30px rgba(14,20,80,.2); }
  button { font: 600 15px system-ui, sans-serif; padding: 12px 18px; border-radius: 12px; border: 0; background: #2338C9; color: #fff; cursor: pointer; }
  p { margin: 0; max-width: 60ch; text-align: center; color: #585E7E; }
</style>
</head>
<body>
<p>Esta es la imagen que muestra WhatsApp cuando mandás el link. Descargala y subila a la raíz del repo como <b>og.png</b>.</p>
<canvas id="cv" width="1200" height="630"></canvas>
<button id="dl" type="button">Descargar og.png</button>
<script src="../assets/config.js"></script>
<script src="../assets/comodin.js"></script>
<script>
(async function () {
  const C = window.COMODIN_CONFIG, cv = document.getElementById("cv"), x = cv.getContext("2d");
  await Comodin.fontsReady();
  const BG = "#E7E9F2";
  x.fillStyle = BG; x.fillRect(0, 0, 1200, 630);
  // tarjeta inclinada
  const W = 330, H = W * 1.4;
  x.save(); x.translate(120 + W / 2, 315); x.rotate(-6 * Math.PI / 180); x.translate(-W / 2, -H / 2);
  x.save(); x.shadowColor = "rgba(14,20,80,.35)"; x.shadowBlur = 50; x.shadowOffsetY = 20; Comodin.rr(x, 0, 0, W, H, W * .05); x.fillStyle = "#2338C9"; x.fill(); x.restore();
  Comodin.drawFront(x, { n: 0, nombre: "", fecha: "" }, W, BG);
  x.restore();
  // texto
  x.textBaseline = "alphabetic"; x.textAlign = "left";
  x.fillStyle = "#585E7E"; x.font = '700 20px "JetBrains Mono"'; if ("letterSpacing" in x) x.letterSpacing = "4px";
  x.fillText("TRANSFERIBLE · NO VENCE", 560, 200);
  if ("letterSpacing" in x) x.letterSpacing = "0px";
  x.fillStyle = "#0E1450"; x.font = '400 64px "Bowlby One"'; x.fillText("Tenés un", 556, 282);
  x.fillStyle = "#2338C9"; x.font = '400 96px "Bowlby One"'; x.fillText("comodín", 552, 380);
  x.fillStyle = "#141833"; x.font = 'italic 500 36px "Instrument Sans"'; x.fillText(`Vale por 1 día de ${C.corto}.`, 560, 444);
  x.fillStyle = "#585E7E"; x.font = '500 22px "JetBrains Mono"'; x.fillText("Abrilo y dalo vuelta ↻", 560, 492);
  document.getElementById("dl").addEventListener("click", () => {
    cv.toBlob((b) => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "og.png"; a.click(); });
  });
})();
</script>
</body>
</html>
